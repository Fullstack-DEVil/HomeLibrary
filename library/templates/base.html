<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}Shelly{% endblock %}
    </title>
    {% load static %}
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'library/css/custom.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-shelly sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/library">
                <img src="{% static 'library/images/logo_shelly.png' %}" alt="Shelly Logo" class="logo-img">
                <span class="brand-text">Shelly</span>
            </a>
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-4">
                    <a class="nav-link active" href="/library">MY LIBRARY</a>
                    <a class="nav-link active" href="/search-book">SEARCH</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
