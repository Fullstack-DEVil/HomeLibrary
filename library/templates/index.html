<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <div class="container">
        <h1>Home Library</h1>
        <ul class="nav bg-info">
            <li class="nav-item">
              <a class="nav-link link-light" href="/">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link link-light" href="/members">MEMBERS</a>
            </li>
        </ul>
    </div>
    <div class="container">
        <ul>
            {% for book in books %}
                <li>{{ book.title }}</li>
            {% endfor %}
        </ul>
    </div>
    <div class="container">
        <h2>Buch per ISBN suchen</h2>
        <form method="post" action="{% url 'search_book_by_isbn' %}" class="row g-2">
            {% csrf_token %}
            <div class="col-auto">
                <input
                    type="text"
                    name="isbn"
                    class="form-control"
                    placeholder="z.B. 9780134685991"
                    required
                >
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-info">Suchen</button>
            </div>
        </form>

        {% if data %}
            <pre class="mt-3">{{ data }}</pre>
        {% endif %}
    </div>
</body>
</html>
